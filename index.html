<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS在线运行工具</title>
  <link rel="stylesheet" href="lib/codemirror/codemirror.css">
  <link rel="stylesheet" href="lib/codemirror/monokai.css">
  <link rel="stylesheet" href="lib/codemirror/show-hint.css">

  <script src="lib/codemirror/codemirror.js"></script>
  <script src="lib/codemirror/javascript.js"></script>
  <script src="lib/codemirror/show-hint.js"></script>
  <script src="lib/codemirror/javascript-hint.js"></script>
  <script src="lib/codemirror/closebrackets.js"></script>
  <script src="lib/codemirror/comment.js"></script>
  <!-- 容错 JS 解析器：用真实语法树收集声明名，加载失败时自动退回正则方案 -->
  <script defer src="lib/acorn/acorn.js"></script>
  <script defer src="lib/acorn/acorn-loose.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h2>JS 在线运行工具</h2>
      <div class="btn-group">
        <button id="runBtn">运行</button>
        <button id="clearEditor">清空</button>
        <button id="formatCode">格式化</button>
        <button id="settingsBtn">设置</button>
      </div>
    </div>
    <div id="cm-editor"></div>
    <div class="console-wrap">
      <div class="console-title-bar">
        <span class="console-title">控制台输出</span>
        <button id="clearBtn">清空控制台</button>
      </div>
      <div id="console"></div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-mask" id="settingsMask">
    <div class="settings-modal">
      <div class="settings-header">
        <span>设置</span>
        <button id="closeSettings" class="icon-btn" title="关闭">✕</button>
      </div>
      <div class="settings-body">
        <div class="setting-row">
          <div class="setting-label">
            编辑器字体大小
            <span class="setting-desc">代码区字号，12–48 px</span>
          </div>
          <div class="stepper">
            <button class="step-btn" id="editorFontMinus" title="减小字号">−</button>
            <span class="step-value" id="editorFontValue">25px</span>
            <button class="step-btn" id="editorFontPlus" title="增大字号">+</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            控制台字体大小
            <span class="setting-desc">输出区字号，10–28 px</span>
          </div>
          <div class="stepper">
            <button class="step-btn" id="consoleFontMinus" title="减小字号">−</button>
            <span class="step-value" id="consoleFontValue">14px</span>
            <button class="step-btn" id="consoleFontPlus" title="增大字号">+</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            死循环保护
            <span class="setting-desc">开启后循环卡住 1 秒即判定死循环并报出行号；关闭时只在超过 5 秒时提示</span>
          </div>
          <div class="setting-actions">
            <label class="switch" title="死循环保护">
              <input type="checkbox" id="loopGuardToggle">
              <span class="switch-slider"></span>
            </label>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            修改后自动运行
            <span class="setting-desc">关闭后修改代码不再自动执行</span>
          </div>
          <div class="setting-actions">
            <label class="switch" title="修改后自动运行">
              <input type="checkbox" id="autoRunToggle" checked>
              <span class="switch-slider"></span>
            </label>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            编辑器主题
            <span class="setting-desc" id="themeDesc">当前：暗黑</span>
          </div>
          <div class="setting-actions">
            <button id="toggleTheme">切换浅色/暗黑</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            代码文件
            <span class="setting-desc">导入本地 .js 文件，或把当前代码按当前时间命名保存</span>
          </div>
          <div class="setting-actions">
            <button id="importJs">导入JS</button>
            <button id="saveJs">保存JS</button>
            <input type="file" id="fileInput" accept=".js">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 清空确认弹窗 -->
  <div class="modal-mask" id="confirmMask">
    <div class="settings-modal confirm-modal">
      <div class="settings-header">
        <span>确认清空</span>
        <button id="closeConfirm" class="icon-btn" title="关闭">✕</button>
      </div>
      <div class="confirm-body">
        当前代码和控制台输出都会被清空，且无法恢复，确定要清空吗？
      </div>
      <div class="modal-footer">
        <button id="confirmCancel">取消</button>
        <button id="confirmClear" class="danger-btn">确定清空</button>
      </div>
    </div>
  </div>

  <!-- 业务脚本：普通脚本按顺序执行，file:// 双击打开也能用 -->
  <script defer src="js/core.js"></script>
  <script defer src="js/console.js"></script>
  <script defer src="js/runner.js"></script>
  <script defer src="js/editor.js"></script>
  <script defer src="js/hint.js"></script>
  <script defer src="js/settings.js"></script>
  <script defer src="js/format.js"></script>
  <script defer src="js/main.js"></script>

</body>
</html>
